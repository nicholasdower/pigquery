<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 14px/1.4 system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        width: 280px;
        background: #1e1e1e;
        color: #e0e0e0;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .header img {
        width: 24px;
        height: 24px;
      }
      .header-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .settings-btn {
        display: flex;
        align-items: center;
        background: none;
        color: #888;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      .settings-btn:hover {
        color: #e0e0e0;
      }
      h1 {
        font-size: 16px;
        margin: 0;
        color: #e0e0e0;
      }
      h2 {
        font-size: 13px;
        font-weight: 500;
        margin: 0 0 8px;
        color: #999;
      }
      .shortcuts {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .shortcut {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        background: #2d2d2d;
        border-radius: 4px;
      }
      .shortcut-name {
        color: #e0e0e0;
      }
      .shortcut-keys {
        color: #89d185;
        font-family: -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
        font-size: 12px;
        white-space: nowrap;
      }
      .refresh-btn {
        display: flex;
        align-items: center;
        background: none;
        color: #888;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      .refresh-btn:hover {
        color: #e0e0e0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="../icons/icon.svg" alt="PigQuery Logo" />
      <h1>PigQuery</h1>
      <div class="header-right">
        <button class="refresh-btn" id="header-refresh-btn"></button>
        <button class="settings-btn" id="settings-btn"></button>
      </div>
    </div>

    <div class="shortcuts">
      <div class="shortcut">
        <span class="shortcut-name" data-i18n="shortcutInsert">Insert</span>
        <span class="shortcut-keys" id="shortcut-insert"></span>
      </div>
      <div class="shortcut">
        <span class="shortcut-name" data-i18n="shortcutFocusTable">Focus table</span>
        <span class="shortcut-keys" id="shortcut-focus-table"></span>
      </div>
      <div class="shortcut">
        <span class="shortcut-name" data-i18n="shortcutShare">Share</span>
        <span class="shortcut-keys" id="shortcut-share"></span>
      </div>
      <div class="shortcut">
        <span class="shortcut-name" data-i18n="shortcutOpenCell">Open Cell</span>
        <span class="shortcut-keys">Alt+Click / Enter</span>
      </div>
      <div class="shortcut">
        <span class="shortcut-name" data-i18n="shortcutCopyCell">Copy cell</span>
        <span class="shortcut-keys" id="shortcut-copy-cell"></span>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
