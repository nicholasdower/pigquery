<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 14px/1.4 system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        width: 280px;
        background: #1e1e1e;
        color: #e0e0e0;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .header img {
        width: 24px;
        height: 24px;
      }
      h1 {
        font-size: 16px;
        margin: 0;
        color: #e0e0e0;
      }
      h2 {
        font-size: 13px;
        font-weight: 500;
        margin: 0 0 8px;
        color: #999;
      }
      .shortcuts {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .shortcut {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        background: #2d2d2d;
        border-radius: 4px;
      }
      .shortcut-name {
        color: #e0e0e0;
      }
      .shortcut-keys {
        color: #89d185;
        font-family: -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
        font-size: 12px;
        white-space: nowrap;
      }
      .footer, .extension {
        border-top: 1px solid #444;
      }
      .footer {
        margin-top: 8px;
        padding-top: 12px;
        text-align: center;
      }
      .footer a {
        color: #0e639c;
        text-decoration: none;
        font-size: 13px;
      }
      .footer a:hover {
        color: #1177bb;
        text-decoration: underline;
      }
      .footer .separator {
        color: #666;
        margin: 0 8px;
      }
      .status {
        margin-top: 8px;
        padding-top: 12px;
        font-size: 12px;
        color: #888;
      }
      .status-error {
        color: #f48771;
        margin-top: 4px;
      }
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .section-header h2 {
        margin: 0;
      }
      .refresh-btn:disabled, .update-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .extension {
        margin-top: 8px;
        padding-top: 12px;
        font-size: 12px;
        color: #888;
      }
      .update-btn, .refresh-btn {
        display: flex;
        align-items: center;
        background: none;
        color: #888;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      .update-btn:hover, .refresh-btn:hover {
        color: #e0e0e0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="../icons/icon.svg" alt="PigQuery Logo" />
      <h1>PigQuery</h1>
    </div>

    <h2 data-i18n="keyboardShortcuts">Keyboard Shortcuts</h2>
    <div class="shortcuts">
      <div class="shortcut">
        <span class="shortcut-name" data-i18n="shortcutInsert">Insert</span>
        <span class="shortcut-keys" id="shortcut-insert"></span>
      </div>
      <div class="shortcut">
        <span class="shortcut-name" data-i18n="shortcutFocusTable">Focus table</span>
        <span class="shortcut-keys" id="shortcut-focus-table"></span>
      </div>
      <div class="shortcut">
        <span class="shortcut-name" data-i18n="shortcutShare">Share</span>
        <span class="shortcut-keys" id="shortcut-share"></span>
      </div>
      <div class="shortcut">
        <span class="shortcut-name" data-i18n="shortcutOpenCell">Open Cell</span>
        <span class="shortcut-keys">Alt+Click / Enter</span>
      </div>
      <div class="shortcut">
        <span class="shortcut-name" data-i18n="shortcutCopyCell">Copy cell</span>
        <span class="shortcut-keys" id="shortcut-copy-cell"></span>
      </div>
    </div>

    <div class="status" id="status">
      <div class="section-header">
        <h2 data-i18n="popupSources">Sources</h2>
        <button class="refresh-btn" id="refresh-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
      <span id="status-text"></span>
      <div class="status-error" id="status-error"></div>
    </div>

    <div class="extension">
      <div class="section-header">
        <h2 data-i18n="popupExtension">Extension</h2>
        <button class="update-btn" id="update-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
      <span id="version-text"></span>
    </div>

    <div class="footer">
      <a href="#" id="options-link" data-i18n="extensionOptions">Extension Options</a>
      <span class="separator">·</span>
      <a href="https://github.com/nicholasdower/pigquery/issues/new/choose" target="_blank" data-i18n="reportBug">Report a Bug</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
