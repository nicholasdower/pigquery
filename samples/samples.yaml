# =============================================================================
# URLS - External lookups for cell data
# =============================================================================

- group: wikipedia
  name: Wikipedia
  regex: ^.*$
  url: https://en.wikipedia.org/w/index.php?search=%s

- group: github
  name: GitHub User
  regex: ^[a-zA-Z0-9_-]+$
  url: https://github.com/%s

- group: github
  name: GitHub Repo
  regex: ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$
  url: https://github.com/%s

- group: common
  name: Google
  regex: ^.*$
  url: https://www.google.com/search?q=%s

- group: common
  name: Google Maps
  regex: ^.*$
  url: https://www.google.com/maps/search/%s

- group: common
  name: Wolfram Alpha
  regex: ^.*$
  url: https://www.wolframalpha.com/input?i=%s
